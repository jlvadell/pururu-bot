[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pururu"
description = "Discord bot for managing attendance"
authors = [
    { name = "Jose Vadell", email = "me@jlvadell.com" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["discord", "bot", "attendance", "management"]
dynamic = ["version"]

# Core dependencies
dependencies = [
    "discord.py~=2.6.4",
    "google-auth~=2.41.1",
    "gspread~=6.2.1",
    "APScheduler~=3.11.0",
    "aioboto3~=15.2.0",
    "dynaconf~=3.2.12",
    "watchdog~=6.0.0",
    "ulid-py~=1.1.0",
    "sqlalchemy~=2.0.44",
    "psycopg2-binary~=2.9.11",
    "prometheus-client~=0.23.1",
]

[project.optional-dependencies]
# Development and testing dependencies
dev = [
    "pytest~=8.4.2",
    "pytest-cov~=7.0.0",
    "pytest-asyncio~=1.2.0",
    "coverage~=7.11.0",
    "pyhamcrest~=2.1.0",
    "moto~=5.1.15",
]

[project.urls]
Homepage = "https://github.com/jlvadell/pururu-bot"
Repository = "https://github.com/jlvadell/pururu-bot"
Issues = "https://github.com/jlvadell/pururu-bot/issues"

[project.scripts]
pururu = "pururu.bot:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "pururu.__version__.get_version"}

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "--cov=pururu --cov-report=xml:coverage.xml --cov-report=term-missing"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src/pururu"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/*.json",
    "*/*.toml",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

