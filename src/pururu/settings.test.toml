[default]
# ----------------------------------------
# General Logging & Attendance Config
# ----------------------------------------
[default.general]
    third_party_default_log_level = "WARNING"
    log_level = "DEBUG"
    attendance_check_delay = 10
    min_attendance_time = 10
    min_attendance_members = 1
    log_format_json = false # use JSON format for logs; required for Grafana Loki
    discord_event_log_enabled = false # send messages to Discord event log channel
    [default.general.players]
      [default.general.players.player1]
      discord_uid = 123
      is_admin = false

      [default.general.players.player2]
      discord_uid = 456
      is_admin = false

      [default.general.players.player3]
      discord_uid = 789
      is_admin = true

# ----------------------------------------
# Event settings
# ----------------------------------------
[default.events]
    game_events_queue_url = "http://sqs.eu-west-1.localhost:4566/000000000000/pururu_test_game_queue.fifo"
    poll_events_queue_url = "http://sqs.eu-west-1.localhost:4566/000000000000/pururu_test_poll_queue.fifo"
    sqs_event_visibility_timeout = 120 # 2 minutes
    events_polling_interval = 20 # seconds
    sns_topic_arn = "arn:aws:sns:eu-west-1:000000000000:pururu_test_topic.fifo"
    aws_sns_endpoint_url = "http://localhost:4566"
    aws_sqs_endpoint_url = "http://localhost:4566"
    aws_region = "eu-west-1"

# ----------------------------------------
# Discord Bot Config
# ----------------------------------------
[default.discord]
    guild_id = 123456
    discord_event_log_channel_id = 789012

# ----------------------------------------
# Google Sheets Adapter
# ----------------------------------------
[default.google_sheets]
    # circuit breaker settings
    failure_threshold = 5
    recovery_timeout = 10

    [default.google_sheets.attendance_player_mapping]
    player1 = "C"
    player2 = "F"
    player3 = "I"


# ----------------------------------------
# KeroWorld session packs (optional)
# Pi production: add these keys to /home/nonroot/app/config/settings.toml
# Put packs_secret in /home/nonroot/app/config/.secrets.toml (never commit a real secret).
# Env vars (prefix PURURU, nested with __):
#   PURURU_KERONWORLD__ENABLED
#   PURURU_KERONWORLD__PACKS_URL
#   PURURU_KERONWORLD__PACKS_SECRET
#   PURURU_KERONWORLD__APP_URL
# ----------------------------------------
[default.keronworld]
    enabled = false
    packs_url = "https://api.keronworld.org/api/internal/session-packs"
    packs_secret = "test-pack-webhook-secret"
    app_url = "https://app.keronworld.org"

# ----------------------------------------
# Secrets
# ----------------------------------------
[default.secrets]
discord_token = "your_discord_token_here"
google_sheets_credentials = "your_google_sheets_credentials_path_here"
spreadsheet_id = "your_spreadsheet_id_here"
