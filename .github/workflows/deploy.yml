name: Deploy RPI
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: What do you want to do?
        options:
          - build_and_deploy
          - restart_only
        default: build_and_deploy
      version_tag:
        type: string
        description: Optional tag to use (fallbacks to git ref or a manual timestamp)
        required: false
jobs:
  deploy:
    runs-on: self-hosted

    env:
      APP_NAME: pururu-bot
      APP_HOME: /home/jlvadell/pururu/
      APP_DIR: /home/jlvadell/pururu/app
      CONFIG_DIR: /home/jlvadell/pururu/config
      DATA_VOLUME: pururu_data

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compute version
      id: ver
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG="${{ inputs.version_tag }}"
          if [ -z "$TAG" ]; then
            TAG="manual-$(date -u +%Y%m%d%H%M%S)"
          fi
        else
          TAG="${GITHUB_REF_NAME}"
        fi

        BUILD_TIME="$(date -u +%Y%m%d%H%M%S)"
        FINAL_VERSION="${TAG}+${BUILD_TIME}"

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$FINAL_VERSION" >> $GITHUB_OUTPUT
        echo "Computed version: $FINAL_VERSION"

    - name: Inject production version into __version__.py
      if: ${{ inputs.mode != 'restart_only' || github.event_name != 'workflow_dispatch' }}
      run: |
        sed -i 's|__version__ = "undefined"|__version__ = "'"${{ steps.ver.outputs.version }}"'"|' src/pururu/__version__.py
        grep '__version__' src/pururu/__version__.py || true

    - name: Ensure data volume exists
      run: |
        docker volume create "${DATA_VOLUME}" >/dev/null

    - name: Sync project into APP_DIR
      run: |
        rsync -a --delete ./ "${APP_DIR}/"

    - name: Build Docker image
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'build_and_deploy' }}
      working-directory: ${{ env.APP_DIR }}
      run: |
        docker build \
          --pull \
          -t "${APP_NAME}:${{ steps.ver.outputs.version }}" \
          -t "${APP_NAME}:latest" \
          --label "org.opencontainers.image.version=${{ steps.ver.outputs.version }}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          .

    - name: Restart container
      working-directory: ${{ env.APP_DIR }}
      run: |
        docker rm -f "${APP_NAME}" 2>/dev/null || true
        docker run -d \
            --name "${APP_NAME}" \
            --restart unless-stopped \
            -v "${CONFIG_DIR}:/home/nonroot/app/config:ro" \
            -v "${DATA_VOLUME}:/home/nonroot/app/data" \
            -v "${APP_HOME}/.aws:/home/nonroot/.aws:ro" \
            "${APP_NAME}:${{ steps.ver.outputs.version }}"

    - name: Clean old images
      run: docker image prune -f
