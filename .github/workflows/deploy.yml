name: Deploy EC2
on:
  push:
    tags:
      - 'v*'
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Inject production version into __version__.py
      run: |
        TAG=$(git describe --tags --abbrev=0)
        BUILD_TIME=$(date -u +%Y%m%d%H%M%S)
        FINAL_VERSION="${TAG}+${BUILD_TIME}"
      
        echo "Injecting production version: $FINAL_VERSION"
        sed -i "s|__version__ = \"undefined\"|__version__ = \"${FINAL_VERSION}\"|" src/pururu/__version__.py

    - name: Load EC2 Key
      run: |
        echo "${{ secrets.EC2_KEY }}" | base64 -d > /tmp/ssh_key
        chmod 700 /tmp/ssh_key

    - name: Sync project files to EC2
      run: |
        rsync -avL --progress -e "ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/app/

    - name: Deploy on EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd /home/${{ secrets.EC2_USER }}/app/
          docker build -t pururu-bot .
          docker stop pururu-bot || true
          docker rm pururu-bot || true
          docker run -d --name pururu-bot -v /home/${{ secrets.EC2_USER }}/config:/home/nonroot/app/config pururu-bot
        EOF